<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071d2b">
<title>Yettel | Credit Control Helper</title>
<style>
:root{--navy:#071d2b;--navy2:#0c2b3b;--green:#b5e61d;--ink:#102b3a;--muted:#60727c;--line:#dce5e6}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--navy);color:white;overflow-x:hidden}
.page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.92fr);position:relative;isolation:isolate}
.page:before{content:"";position:absolute;z-index:-1;inset:0 38% 0 0;background:linear-gradient(135deg,#061824,#0b2c3d 72%);clip-path:polygon(0 0,100% 0,76% 100%,0 100%)}
.page:after{content:"";position:absolute;z-index:-2;right:0;top:0;width:48%;height:100%;background:radial-gradient(ellipse at 80% 25%,#28576a 0,transparent 42%),linear-gradient(145deg,#143b4d,#071d2b 70%)}
.left{padding:clamp(32px,6vw,90px);display:flex;flex-direction:column;justify-content:center;min-height:100vh}.logo{font-size:clamp(42px,5vw,68px);font-weight:850;letter-spacing:-.075em;color:var(--green);line-height:1}.dash{width:54px;height:7px;border-radius:9px;background:var(--green);margin:54px 0 28px}.left h1{font-size:clamp(42px,5.4vw,72px);line-height:1.02;letter-spacing:-.055em;margin:0 0 18px;max-width:650px}.left .subtitle{font-size:clamp(18px,2vw,25px);color:#c6d2d8;margin:0}.features{display:flex;gap:clamp(18px,3vw,44px);margin-top:58px;flex-wrap:wrap}.feature{width:110px;text-align:center;color:#f1f6f7;font-size:14px;line-height:1.35}.feature .symbol{display:block;font-size:30px;margin-bottom:10px;color:var(--green)}
.right{display:flex;align-items:center;justify-content:center;padding:35px}.login{width:min(100%,540px);background:rgba(250,253,250,.96);color:var(--ink);border:1px solid rgba(255,255,255,.75);border-radius:28px;padding:clamp(28px,4vw,54px);box-shadow:0 25px 80px #0005}.login h2{font-size:clamp(26px,3vw,36px);margin:0 0 8px;letter-spacing:-.04em}.login p{margin:0 0 30px;color:var(--muted);font-size:16px}.field-label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}.select-wrap{position:relative}.select-wrap:after{content:"⌄";position:absolute;right:18px;top:10px;font-size:23px;color:#183748;pointer-events:none}select{appearance:none;width:100%;height:60px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 48px 0 18px;color:var(--ink);font:inherit;font-size:16px;outline:none}select:focus{border-color:#9bc51a;box-shadow:0 0 0 4px #b5e61d35}.enter{width:100%;height:62px;border:0;border-radius:14px;background:var(--green);color:#142b35;font-size:18px;font-weight:800;margin-top:22px;cursor:pointer;transition:transform .15s,filter .15s}.enter:hover{filter:brightness(1.04);transform:translateY(-1px)}.enter:disabled{opacity:.45;cursor:not-allowed;transform:none}.team{display:flex;align-items:center;justify-content:center;gap:10px;border-top:1px solid var(--line);margin-top:28px;padding-top:22px;font-weight:750}.team span{color:#83ae00}.error{min-height:20px;color:#b42318;font-size:13px;margin-top:10px}.footer{position:absolute;bottom:20px;left:clamp(32px,6vw,90px);font-size:11px;letter-spacing:.12em;color:#9eb1b9}
@media(max-width:900px){.page{grid-template-columns:1fr}.page:before{inset:0;clip-path:none}.page:after{display:none}.left{min-height:auto;padding:38px 28px 10px}.logo{font-size:44px}.dash{margin:28px 0 18px}.left h1{font-size:42px}.features{display:none}.right{padding:24px 20px 70px}.login{max-width:520px}.footer{left:28px;bottom:18px}}
@media(max-width:480px){.left{padding:30px 22px 4px}.left h1{font-size:36px}.left .subtitle{font-size:16px}.right{padding:20px 14px 65px}.login{padding:26px 22px;border-radius:22px}.login h2{font-size:26px}.login p{font-size:14px;margin-bottom:24px}select{height:56px}.enter{height:58px}}
</style>
</head>
<body>
<div class="page">
<section class="left">
  <div class="logo">Yettel.</div>
  <div class="dash"></div>
  <h1>Credit Control<br>Helper</h1>
  <p class="subtitle">Вътрешен екипен портал</p>
  <div class="features">
    <div class="feature"><span class="symbol">◉</span>Бази<br>и достъп</div>
    <div class="feature"><span class="symbol">⌘</span>SQL<br>инструменти</div>
    <div class="feature"><span class="symbol">▦</span>Работен<br>график</div>
    <div class="feature"><span class="symbol">▤</span>Шаблони<br>и коментари</div>
  </div>
</section>
<section class="right">
  <form class="login" id="loginForm">
    <h2>Добре дошли</h2>
    <p>Избери член на екипа, за да продължиш.</p>
    <label class="field-label" for="teamMember">Член на екипа</label>
    <div class="select-wrap"><select id="teamMember" required><option value="">Избери член на екипа</option></select></div>
    <div class="error" id="error" aria-live="polite"></div>
    <button class="enter" id="enterButton" type="submit" disabled>Вход　→</button>
    <div class="team">♧　Credit Control <span>Team</span></div>
  </form>
</section>
<div class="footer">INTERNAL WORKSPACE · CREDIT CONTROL</div>
</div>
<script>
// Членове на екипа – подредени по азбучен ред.
const TEAM_MEMBERS = [
  "Desislava Metodieva",
  "Domenika Stoyanova",
  "Georgi Yanev",
  "Radostina Sabeva",
  "Vesela Milusheva"
];
const select = document.getElementById("teamMember");
const enterButton = document.getElementById("enterButton");
TEAM_MEMBERS.forEach(name => {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  select.appendChild(option);
});
select.addEventListener("change", () => { enterButton.disabled = !select.value; document.getElementById("error").textContent = ""; });
document.getElementById("loginForm").addEventListener("submit", event => {
  event.preventDefault();
  if (!select.value) { document.getElementById("error").textContent = "Моля, избери член на екипа."; return; }
  sessionStorage.setItem("cch_user", select.value);
  window.location.href = "app.html";
});
</script>
</body>
</html>
